<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بطاقات تعريف الموظفين — نوى</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Markazi+Text:wght@600&display=swap" rel="stylesheet">
<style>
  :root{
    --maroon:#a21008;
    --maroon-dark:#7a0c05;
    --gold:#d4a017;
    --gold-light:#f0c95e;
    --pink:#ff9798;
    --white:#ffffff;
    --ink:#2a1210;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Cairo', 'Tahoma', sans-serif;
    background:linear-gradient(180deg,#fbeceb 0%, #f6f6f6 60%);
    color:var(--ink);
    padding:28px 16px 60px;
  }
  .page-header{
    text-align:center;
    max-width:900px;
    margin:0 auto 26px;
  }
  .page-header .brand-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    margin-bottom:6px;
  }
  .logo-arch{
    width:46px;height:52px;
    background:var(--maroon);
    border-radius:50% 50% 6px 6px / 60% 60% 6px 6px;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 6px rgba(162,16,8,.35);
  }
  .logo-arch svg{width:30px;height:30px;}
  .page-header h1{
    font-size:24px;
    font-weight:800;
    color:var(--maroon-dark);
    margin:0;
  }
  .page-header p{
    font-size:13px;
    color:#8a6a5a;
    margin:4px 0 0;
    letter-spacing:.5px;
  }
  .toolbar{
    text-align:center;
    margin-bottom:28px;
  }
  .toolbar button{
    background:var(--maroon);
    color:var(--white);
    border:none;
    padding:10px 22px;
    border-radius:8px;
    font-family:inherit;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 3px 8px rgba(162,16,8,.3);
  }
  .toolbar button:hover{background:var(--maroon-dark);}
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(300px,1fr));
    gap:22px;
    max-width:1400px;
    margin:0 auto;
  }
  .card{
    background:var(--white);
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 6px 18px rgba(122,12,5,.16);
    border:1px solid #f0d9d6;
    display:flex;
    flex-direction:column;
    break-inside:avoid;
  }
  .card-header{
    position:relative;
    background:linear-gradient(135deg, var(--maroon) 0%, var(--maroon-dark) 100%);
    padding:16px 16px 34px;
    text-align:center;
    color:var(--white);
    background-image:
      linear-gradient(135deg, var(--maroon) 0%, var(--maroon-dark) 100%),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='44' height='44'><path d='M0 44 L0 22 A22 22 0 0 1 44 22 L44 44 Z' fill='white' opacity='0.14'/></svg>");
    background-repeat:no-repeat, repeat-x;
    background-size:cover, 44px 44px;
  }
  .card-header .assoc-ar{
    font-size:14px;
    font-weight:800;
    margin:0;
  }
  .card-header .assoc-en{
    font-size:9px;
    letter-spacing:.6px;
    opacity:.85;
    margin:3px 0 0;
    font-family:'Cairo', sans-serif;
  }
  .badge-title{
    position:absolute;
    bottom:8px;
    left:0;right:0;
    font-size:10px;
    letter-spacing:2px;
    color:var(--gold-light);
    font-weight:700;
  }
  .emblem{
    width:66px;height:66px;
    border-radius:50%;
    background:linear-gradient(145deg, var(--gold-light), var(--gold));
    border:3px solid var(--white);
    margin:-33px auto 0;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 3px 8px rgba(0,0,0,.2);
    position:relative;
    z-index:2;
    overflow:hidden;
  }
  .emblem img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
  .emblem span{font-size:20px;font-weight:800;color:var(--maroon-dark);}
  .card-body{
    padding:10px 18px 4px;
    text-align:center;
    flex:1;
  }
  .emp-name{
    font-size:16px;
    font-weight:800;
    color:var(--maroon-dark);
    margin:2px 0 6px;
  }
  .center-pill{
    display:inline-block;
    background:var(--pink);
    color:#7a1c1c;
    font-size:11px;
    font-weight:700;
    padding:4px 14px;
    border-radius:20px;
    margin-bottom:12px;
  }
  .qr-wrap{
    display:flex;
    justify-content:center;
    margin-bottom:10px;
  }
  .qr-wrap img{
    width:150px;height:150px;
    padding:6px;
    background:var(--white);
    border:3px solid var(--gold);
    border-radius:10px;
  }
  .emp-number{
    font-size:12px;
    color:#8a6a5a;
    margin-bottom:12px;
  }
  .emp-number b{color:var(--maroon-dark);font-size:14px;}
  .card-footer{
    border-top:1.5px dashed var(--pink);
    background:#fff6f5;
    padding:8px 10px;
    text-align:center;
    font-size:11px;
    letter-spacing:1px;
    color:var(--maroon-dark);
    font-weight:700;
    font-family:'Markazi Text', monospace;
  }
  @media print{
    body{background:#fff;padding:0;}
    .toolbar, .page-header{display:none;}
    .grid{gap:10px;}
    .card{box-shadow:none;border:1px solid #ccc;}
  }
</style>
</head>
<body>
  <div class="page-header">
    <div class="brand-row">
      <div class="logo-arch">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 20V11C4 6.58 7.58 3 12 3C16.42 3 20 6.58 20 11V20" stroke="white" stroke-width="1.6"/><path d="M8 20V13.5C8 11 9.8 9 12 9C14.2 9 16 11 16 13.5V20" stroke="white" stroke-width="1.4"/></svg>
      </div>
      <h1>جمعية نوى للثقافة والفنون</h1>
    </div>
    <p>NAWA FOR CULTURE AND ARTS ASSOCIATION — بطاقات تعريف الموظفين</p>
  </div>
  <div class="toolbar">
    <button onclick="window.print()">طباعة / حفظ PDF</button>
  </div>
  <div class="grid" id="grid"></div>

<script>
const EMP = [["NW-001-A","ريم محمد حسن أبوجبر","1","مركز الإدارة والتدريب",""],["NW-019-A","ناريمان عيسى عبدالرحمن الفليت","19","مركز الإدارة والتدريب",""],["NW-009-A","سالم إبراهيم شاكر غنام","9","مركز الإدارة والتدريب",""],["NW-072-A","ياسمين هلال سلامة أبو سمرة","72","مركز الإدارة والتدريب",""],["NW-041-A","أمل زكي محمد الشرفا","41","مركز الإدارة والتدريب",""],["NW-067-A","صابرين أحمد توفيق عنابة","67","مركز الإدارة والتدريب",""],["NW-051-A","شيرين عاطف عبد الله محمود","51","مركز الإدارة والتدريب",""],["NW-006-A","ريم صلاح محمد البحيصي","6","مركز الإدارة والتدريب",""],["NW-008-A","رانيا رأفت محمد صباح","8","مركز الإدارة والتدريب",""],["NW-144-A","أحمد عبد الرؤوف أحمد الطلاع","144","مركز الإدارة والتدريب",""],["NW-092-A","طه عطية سالم أبو نمر","92","مركز الإدارة والتدريب","https://drive.google.com/thumbnail?id=18o4Ouqtkn9k7M1oNKV5ewNyOL9TfEnhk&sz=w400"],["NW-143-A","بسنت رياض حسن العكلوك","143","مركز الإدارة والتدريب",""],["NW-107-A","حنين مروان عبد الكريم أبو سليم","107","مركز الإدارة والتدريب",""],["NW-123-A","فاطمة يونس خليل شاهين","123","مركز الإدارة والتدريب",""],["NW-037-A","فيحاء فيصل عبد السلام المصري","37","مركز الإدارة والتدريب",""],["NW-145-A","لينا هشام سليمان موسى","145","مركز الإدارة والتدريب",""],["NW-146-A","عائشة محمد شعبان القرم","146","مركز الإدارة والتدريب",""],["NW-044-A","آمنة عماد عبد الرحمن سمرة","44","مركز الزيتونة",""],["NW-066-A","نرمين نعمان سعيد ناجي","66","نقطة تعليمية خارجي",""],["NW-111-A","حنين عدنان سعيد حمدان","111","نقطة تعليمية خارجي",""],["NW-125-A","خلود محمد سلامة أبو منديل","125","نقطة تعليمية خارجي",""],["NW-012-A","سماح رشاد رمضان أبو ربيع","12","حاضنة النوى",""],["NW-136-A","سهام إبراهيم محمد محمود","136","نقطة تعليمية خارجي",""],["NW-046-A","سوسن رفعت فايز أبو ركاب","46","مركز الخضر للأطفال",""],["NW-007-A","سمير شفيق سعيد الحانوتي","7","مركز الخضر للأطفال",""],["NW-137-A","دعاء عبدالرحمن أحمد الشنطي","137","روضة الحكايات",""],["NW-020-A","ألماظة سلامة سليم العطار","20","روضة الحكايات",""],["NW-129-A","سماح محمد شكري أبو أمونة","129","روضة الحكايات",""],["NW-065-A","علا يونس علي صرصور","65","روضة الحكايات",""],["NW-141-A","إسلام ديب شحادة منصور","141","مركز الخضر للأطفال",""]];
const grid = document.getElementById('grid');
EMP.forEach(function(row){
  const card = row[0], name = row[1], num = row[2], center = row[3], photo = row[4];
  const qrUrl = 'https://api.qrserver.com/v1/create-qr-code/?size=220x220&margin=0&data=' + encodeURIComponent(card);
  const el = document.createElement('div');
  el.className = 'card';
  el.innerHTML =
    '<div class="card-header">' +
      '<p class="assoc-ar">جمعية نوى للثقافة والفنون</p>' +
      '<p class="assoc-en">NAWA CULTURE &amp; ARTS</p>' +
      '<span class="badge-title">بطاقة تعريف موظف</span>' +
    '</div>' +
    '<div class="emblem">' + (photo ? ('<img src="'+photo+'" alt="">') : '<span>نوى</span>') + '</div>' +
    '<div class="card-body">' +
      '<p class="emp-name">' + name + '</p>' +
      '<span class="center-pill">' + center + '</span>' +
      '<div class="qr-wrap"><img src="' + qrUrl + '" alt="QR"></div>' +
      '<p class="emp-number">الرقم الوظيفي: <b>' + num + '</b></p>' +
    '</div>' +
    '<div class="card-footer">' + card + '</div>';
  grid.appendChild(el);
});
</script>
</body>
</html>
