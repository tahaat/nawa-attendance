<style>
  :root{
    --maroon:#8b1114;
    --maroon-dark:#6f0e11;
    --maroon-soft:#a3252a;
    --cream:#fdfaf8;
    --cream2:#f7efec;
    --tan:#b08d57;
    --line:#e8d6d2;
    --ink:#3a2320;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Graphik Arabic','Graphik Arabic Semibold','Graphik','Alexandria','Cairo','Tahoma',sans-serif;
    background:linear-gradient(180deg,#f9efed 0%, #f5f5f5 60%);
    color:var(--ink);
    padding:26px 16px 60px;
  }
  /* ===== ترويسة الصفحة ===== */
  .page-header{text-align:center;max-width:900px;margin:0 auto 20px;}
  .page-header h1{font-size:22px;font-weight:700;color:var(--maroon-dark);margin:0;}
  .page-header p{font-size:12px;color:#8a6a5a;margin:5px 0 0;letter-spacing:.4px;}
 
  /* ===== شريط الأدوات ===== */
  .bar{max-width:1400px;margin:0 auto 16px;display:flex;flex-wrap:wrap;gap:9px;
       align-items:center;justify-content:center;}
  .bar select,.bar input[type=search]{font-family:inherit;font-size:12.5px;padding:8px 12px;
       border:1px solid #e3c9c6;border-radius:8px;background:#fff;color:var(--ink);min-width:170px;}
  .bar button{background:var(--maroon);color:#fff;border:none;padding:8px 16px;border-radius:8px;
       font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer;
       box-shadow:0 3px 8px rgba(139,17,20,.26);}
  .bar button.ghost{background:#fff;color:var(--maroon-dark);border:1px solid #e3c9c6;box-shadow:none;}
  .bar button:hover{filter:brightness(.95);}
  .bar .count{font-size:12.5px;color:#8a6a5a;}
  .warnbtn b{background:var(--tan);color:#fff;border-radius:10px;padding:1px 7px;
       font-size:11px;margin-inline-start:6px;}
  .status{max-width:1400px;margin:0 auto 12px;text-align:center;font-size:12.5px;color:#8a6a5a;}
  .status.err{color:var(--maroon);font-weight:600;}
 
  /* ===== لوحة الفحص ===== */
  .panel{max-width:1000px;margin:0 auto 22px;background:#fff;border:1px solid var(--line);
       border-radius:14px;padding:18px 20px;box-shadow:0 6px 18px rgba(111,14,17,.08);}
  .panel h2{font-size:15px;color:var(--maroon-dark);margin:0 0 10px;}
  .panel h3{font-size:13px;margin:16px 0 6px;color:var(--maroon-dark);}
  .panel ul{margin:0;padding-inline-start:20px;font-size:12.5px;line-height:1.9;color:#5a3f38;}
  .panel .ok{color:#1d6b3f;font-weight:600;font-size:12.5px;}
  .sev{display:inline-block;font-size:10px;font-weight:700;border-radius:6px;
       padding:1px 7px;margin-inline-end:6px;vertical-align:1px;}
  .sev.hi{background:#fbe0de;color:#8b1114;} .sev.mid{background:#fdf0d3;color:#8a6300;}
  .sev.low{background:#e7f1ea;color:#1d6b3f;}
 
  /* ===== شاشة الإعدادات ===== */
  .modal{position:fixed;inset:0;background:rgba(42,18,16,.55);display:flex;
       align-items:center;justify-content:center;padding:20px;z-index:50;}
  .modal.hide{display:none;}
  .modal .box{background:#fff;border-radius:16px;padding:24px;max-width:460px;width:100%;
       box-shadow:0 12px 40px rgba(0,0,0,.3);}
  .modal h2{margin:0 0 6px;font-size:17px;color:var(--maroon-dark);}
  .modal p.hint{font-size:12px;color:#8a6a5a;margin:0 0 14px;line-height:1.7;}
  .modal label{display:block;font-size:12px;font-weight:600;margin:12px 0 5px;color:var(--maroon-dark);}
  .modal input{width:100%;font-family:inherit;font-size:12.5px;padding:10px 12px;
       border:1px solid #e3c9c6;border-radius:8px;}
  .modal .row{display:flex;gap:10px;margin-top:18px;}
  .modal .row button{flex:1;}
 
  /* ===== شبكة البطاقات ===== */
  .grid{display:flex;flex-wrap:wrap;gap:8mm;justify-content:center;
        max-width:1400px;margin:0 auto;}

    display:flex;

    overflow:hidden;
    box-shadow:0 5px 16px rgba(111,14,14,.13);
    break-inside:avoid;page-break-inside:avoid;

  .side-main>*{position:relative;z-index:1;}
  .side-qr{width:31.3mm;padding:3mm 1.5mm;background:#f6ece7;
    border-left:.2mm solid #ecd9d5;}
 
  .logo{height:20mm;width:auto;object-fit:contain;}
  .rule{display:flex;align-items:center;justify-content:center;gap:1.5mm;
    width:64%;margin:2.4mm 0 2.6mm;}
  .rule i{flex:1;height:.25mm;background:linear-gradient(90deg,rgba(185,97,90,0),#c98d86);}
  .rule i:last-of-type{background:linear-gradient(270deg,rgba(185,97,90,0),#c98d86);}
  .rule b{width:1.3mm;height:1.3mm;transform:rotate(45deg);
    border:.18mm solid #b9615a;background:transparent;}
  .nm-1{font-size:4.2mm;font-weight:700;color:#6f0e0e;line-height:1.25;margin:0;}
  .nm-2{font-size:2.6mm;font-weight:400;color:#9a827b;margin:.9mm 0 0;letter-spacing:.01em;}
  .no{font-size:2.3mm;color:#9a827b;font-weight:400;margin:3mm 0 0;}
  .no b{color:#9b1414;font-size:3.1mm;font-weight:700;margin-inline-start:1.2mm;}
  .pill{display:inline-block;margin-top:2.8mm;border:.22mm solid #e0bdb8;
    border-radius:6mm;padding:1.1mm 5mm;background:#f6ece7;}
  .pill span{display:block;font-size:2.5mm;font-weight:600;color:#6f0e0e;line-height:1.3;}
  .qr{width:24.5mm;height:24.5mm;padding:.8mm;background:#fff;
    border:.35mm solid #9e1b1a;border-radius:1.8mm;}
  .code{margin-top:2.6mm;font-size:2.4mm;font-weight:700;letter-spacing:.12em;color:#6f0e0e;}
 
  /* ===== أدوات الاختيار (لا تُطبع) ===== */
  .pick{position:absolute;top:2mm;left:2mm;z-index:4;width:16px;height:16px;
    cursor:pointer;accent-color:var(--maroon);}
  .flag{position:absolute;top:2mm;right:2mm;z-index:4;background:var(--tan);
    color:#fff;font-size:9px;font-weight:600;border-radius:7px;padding:1px 7px;}
  .card.off{opacity:.35;}
  .hide{display:none !important;}
 
  @media print{
    @page{size:A4;margin:10mm;}
    body{background:#fff;padding:0;}
    .bar,.panel,.status,.modal,.page-header,.pick,.flag{display:none !important;}
    .grid{gap:6mm;justify-content:flex-start;}
    .card{box-shadow:none;opacity:1 !important;}
    .card.off{display:none !important;}

<body>
  <div class="page-header">
    <h1>جمعية نوى للثقافة والفنون</h1>
    <p>NAWA FOR CULTURE AND ARTS ASSOCIATION — بطاقات تعريف الموظفين</p>
  </div>
 
  <div class="bar">
    <select id="fCenter"><option value="">كل المراكز</option></select>
    <input id="fSearch" type="search" placeholder="بحث بالاسم أو الرقم…">
    <button class="ghost" id="btnAll">تحديد الكل</button>
    <button class="ghost" id="btnNone">إلغاء التحديد</button>
    <button class="ghost" id="btnNeed">المطلوب إعادة طباعته</button>
    <button class="ghost warnbtn" id="btnCheck">فحص البيانات<b id="issueCount">0</b></button>
    <button class="ghost" id="btnSync">تحديث من القاعدة</button>
    <button class="ghost" id="btnCfg">إعدادات</button>
    <button id="btnPrint">طباعة المحدد</button>
    <span class="count" id="count"></span>
  </div>
 
  <div class="status" id="status"></div>
  <div class="panel hide" id="panel"></div>
  <div class="grid" id="grid"></div>
 
  <div class="modal hide" id="modal">
    <div class="box">
      <h2>إعدادات الاتصال</h2>
      <p class="hint">تُحفظ في هذا المتصفح فقط (localStorage) ولا تُرفع إلى المستودع.
        وإن كان تطبيق البوابة يعمل على نفس النطاق فستُستورد إعداداته تلقائياً.</p>
      <label>رابط الخدمة (Web app URL)</label>
      <input id="cfgUrl" dir="ltr" placeholder="https://script.google.com/macros/s/.../exec">
      <label>رمز الحماية (Token)</label>
      <input id="cfgToken" dir="ltr" placeholder="الرمز نفسه الموجود في السكربت">
      <div class="row">
        <button class="ghost" id="btnCancel">إغلاق</button>
        <button id="btnSave">حفظ واتصال</button>
      </div>
    </div>
  </div>

/* ===== خريطة أسماء المراكز =====
   المفتاح = القيمة كما هي مخزّنة في الشيت (بأي لغة)، والقيمة = [بالعربية, بالإنجليزية].
   أضف أي مركز جديد هنا؛ وأي مركز غير مذكور تنبّهك إليه لوحة الفحص. */
var CENTERS={
  "administration and training center":["مركز الإدارة والتدريب","Administration and Training Center"],
  "management and training center":["مركز الإدارة والتدريب","Management and Training Center"],
  "administration & training center":["مركز الإدارة والتدريب","Administration & Training Center"],
  "مركز الإدارة والتدريب":["مركز الإدارة والتدريب","Administration & Training Center"],
  "al-zaytouna center":["مركز الزيتونة","Al-Zaytouna Center"],
  "al zaytouna center":["مركز الزيتونة","Al-Zaytouna Center"],
  "مركز الزيتونة":["مركز الزيتونة","Al-Zaytouna Center"],
  "al-khader children center":["مركز الخضر للأطفال","Al-Khader Children Center"],
  "مركز الخضر للأطفال":["مركز الخضر للأطفال","Al-Khader Children Center"],
  "hekayat kindergarten":["روضة الحكايات","Hekayat Kindergarten"],
  "روضة الحكايات":["روضة الحكايات","Hekayat Kindergarten"],
  "nawa incubator":["حاضنة النوى","Nawa Incubator"],
  "حاضنة النوى":["حاضنة النوى","Nawa Incubator"],
  "external educational point":["نقطة تعليمية خارجي","External Educational Point"],
  "نقطة تعليمية خارجي":["نقطة تعليمية خارجي","External Educational Point"]
};
var ACTIVE=["سارية","valid","active","نشط"];
 
var cfg=null, rows=[], issues=[], printed={};
 
function load(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function norm(s){return String(s==null?"":s).trim().toLowerCase().replace(/\s+/g," ")}
function hasArabic(s){return /[\u0600-\u06FF]/.test(String(s||""))}
function isActive(s){return ACTIVE.indexOf(norm(s))>=0}
function empNo(r){var m=String(r.code||'').match(/\d+/);
  return m?String(parseInt(m[0],10)):String(r.code||'')}
function setStatus(m,e){var el=$("#status");el.textContent=m||"";el.className="status"+(e?" err":"")}
 
/* ===== تطبيع صف الموظف ===== */
function shape(b){
  var craw=String(b.center||"").trim();
  var pair=CENTERS[norm(craw)]||null;
  var cAr=String(b.center_ar||b.centerAr||"").trim()||(pair?pair[0]:"");
  var cEn=String(b.center_en||b.centerEn||"").trim()||(pair?pair[1]:"");
  if(!cAr && !cEn){ if(hasArabic(craw)) cAr=craw; else cEn=craw; }
  var nAr=String(b.name_ar||b.nameAr||"").trim();
  var nEn=String(b.name_en||b.nameEn||"").trim();
  var nraw=String(b.name||"").trim();
  if(!nAr && hasArabic(nraw)) nAr=nraw;
  if(!nEn && !hasArabic(nraw)) nEn=nraw;
  return {
    card:String(b.card||"").trim(),
    code:String(b.code||"").trim(),
    nameRaw:nraw, nameAr:nAr, nameEn:nEn,
    centerRaw:craw, centerAr:cAr, centerEn:cEn, centerMapped:!!pair,
    status:String(b.status==null?"":b.status).trim(),
    on:true
  };
}
 
/* ===== الفحص ===== */
function check(){
  issues=[];
  var seenCard={}, seenCode={};
  rows.forEach(function(r){
    var who=r.nameAr||r.nameEn||r.card||"(بلا اسم)";
    if(!r.card) issues.push(["hi","رقم بطاقة فارغ لـ «"+who+"» — لن يعمل الـ QR"]);
    else{
      if(seenCard[r.card]) issues.push(["hi","رقم البطاقة "+r.card+" مكرر: «"+seenCard[r.card]+"» و«"+who+"»"]);
      seenCard[r.card]=who;
      if(!/^NW-\d{3}-[A-Z]$/.test(r.card)) issues.push(["mid","صيغة رقم البطاقة غير معتادة: "+r.card+" («"+who+"»)"]);
    }
    if(r.code){
      if(seenCode[r.code]) issues.push(["hi","الرقم الوظيفي "+r.code+" مكرر: «"+seenCode[r.code]+"» و«"+who+"»"]);
      seenCode[r.code]=who;
    } else issues.push(["mid","الرقم الوظيفي فارغ لـ «"+who+"»"]);
    if(!r.nameRaw) issues.push(["hi","الاسم فارغ في الصف "+r.card]);
    if(!r.nameAr) issues.push(["mid","لا يوجد اسم عربي لـ «"+who+"» — أضف عمود name_ar"]);
    if(!r.nameEn) issues.push(["low","لا يوجد اسم إنجليزي لـ «"+who+"» — أضف عمود name_en"]);
    if(!r.centerRaw) issues.push(["hi","المركز فارغ لـ «"+who+"»"]);
    else if(!r.centerMapped) issues.push(["mid","المركز «"+r.centerRaw+"» غير معرّف في خريطة CENTERS — سيُطبع بلغة واحدة ("+who+")"]);
    if(r.status && !isActive(r.status)) issues.push(["low","بطاقة «"+who+"» حالتها «"+r.status+"» — مستبعدة من الطباعة"]);
  });
  $("#issueCount").textContent=issues.length;
}
 
/* ===== المطلوب إعادة طباعته ===== */
function sig(r){return r.nameAr+"|"+r.nameEn+"|"+r.centerAr+"|"+r.centerEn+"|"+r.code}
function needsPrint(r){
  if(!printed[r.card]) return "جديد";
  if(printed[r.card]!==sig(r)) return "تغيّرت بياناته";
  return "";
}
 
/* ===== الرسم ===== */
function render(){
  var fc=$("#fCenter").value, q=norm($("#fSearch").value), grid=$("#grid");
  grid.innerHTML=""; var shown=0, picked=0;
  rows.forEach(function(r,i){
    var key=r.centerAr||r.centerEn;
    if(fc && key!==fc) return;
    if(q && norm(r.nameAr+" "+r.nameEn+" "+r.code+" "+r.card).indexOf(q)<0) return;
    shown++; if(r.on) picked++;
    var qr='https://api.qrserver.com/v1/create-qr-code/?size=300x300&margin=0&ecc=M&data='+encodeURIComponent(r.card);
    var flag=needsPrint(r);
    var n1=r.nameEn||r.nameAr, n2=(r.nameEn&&r.nameAr)?r.nameAr:'';
    var n1rtl=!r.nameEn;
    var centerLabel=r.centerEn||r.centerAr;
    var el=document.createElement('div');
    el.className='card'+(r.on?'':' off');
    el.innerHTML=
      '<div class="topbar"></div>'+
      '<input class="pick" type="checkbox" data-i="'+i+'"'+(r.on?' checked':'')+' title="اختيار للطباعة">'+
      (flag?'<span class="flag">'+flag+'</span>':'')+
      '<div class="side side-main">'+
        '<img class="logo" src="'+LOGO+'" alt="نوى">'+
        '<div class="rule"><i></i><b></b><i></i></div>'+
        (n1?'<p class="nm-1"'+(n1rtl?' dir="rtl"':'')+'>'+esc(n1)+'</p>':'')+
        (n2?'<p class="nm-2" dir="rtl">'+esc(n2)+'</p>':'')+
        '<p class="no">Employee No.<b>'+esc(empNo(r))+'</b></p>'+
        (centerLabel?('<span class="pill"><span>'+esc(centerLabel)+'</span></span>'):'')+
      '</div>'+
      '<div class="side side-qr">'+
        '<img class="qr" src="'+qr+'" alt="QR">'+
        '<div class="code">'+esc(r.card)+'</div>'+
      '</div>';
    grid.appendChild(el);
  });
  $("#count").textContent="المعروض: "+shown+" · المحدد للطباعة: "+picked+" · الإجمالي: "+rows.length;
}
 
function fillCenters(){
  var sel=$("#fCenter"), cur=sel.value, seen={}, list=[];
  rows.forEach(function(r){var k=r.centerAr||r.centerEn;
    if(k&&!seen[k]){seen[k]=1;list.push(k)}});
  list.sort();
  sel.innerHTML='<option value="">كل المراكز</option>'+list.map(function(c){
    return '<option value="'+esc(c)+'">'+esc(c)+'</option>'}).join("");
  sel.value=cur;
}
 
function apply(list,fromCache){
  rows=list.map(shape);
  rows.forEach(function(r){r.on=!r.status||isActive(r.status)});
  fillCenters(); check(); render();
  var n=rows.filter(function(r){return needsPrint(r)}).length;
  setStatus((fromCache?"نسخة مخزّنة على الجهاز — ":"محدّث من القاعدة — ")+rows.length+" موظفاً"+
            (n?" · "+n+" بطاقة تحتاج طباعة":"")+(issues.length?" · "+issues.length+" ملاحظة":""), fromCache);
}
 
function sync(){
  if(!cfg||!cfg.url){openCfg();return}
  setStatus("جارٍ الاتصال بالقاعدة…");
  fetch(cfg.url+"?action=badges&token="+encodeURIComponent(cfg.token||""))
   .then(function(r){return r.json()})
   .then(function(j){
      if(!j.ok){setStatus("رفض الخادم: "+(j.error||"غير معروف"),true);return}
      var list=j.badges||[];
      save(K.cache,{at:Date.now(),badges:list});
      apply(list,false);
   })
   .catch(function(){
      var c=load(K.cache,null);
      if(c&&c.badges){apply(c.badges,true);
        setStatus("تعذّر الاتصال — عُرضت نسخة مخزّنة بتاريخ "+new Date(c.at).toLocaleString("ar-EG"),true);}
      else setStatus("تعذّر الاتصال ولا توجد نسخة مخزّنة — راجع الرابط والتوكن",true);
   });
}
 
function openCfg(){
  $("#cfgUrl").value=(cfg&&cfg.url)||""; $("#cfgToken").value=(cfg&&cfg.token)||"";
  $("#modal").classList.remove("hide");
}
 
$("#btnSave").onclick=function(){
  var u=$("#cfgUrl").value.trim();
  if(!u){alert("أدخل رابط الخدمة أولاً");return}
  cfg={url:u,token:$("#cfgToken").value.trim()};
  save(K.cfg,cfg); $("#modal").classList.add("hide"); sync();
};
$("#btnCancel").onclick=function(){$("#modal").classList.add("hide")};
$("#btnCfg").onclick=openCfg;
$("#btnSync").onclick=sync;
$("#fCenter").onchange=render;
$("#fSearch").oninput=render;
$("#btnAll").onclick=function(){rows.forEach(function(r){r.on=true});render()};
$("#btnNone").onclick=function(){rows.forEach(function(r){r.on=false});render()};
$("#btnNeed").onclick=function(){rows.forEach(function(r){r.on=!!needsPrint(r)});render()};
$("#grid").addEventListener("change",function(e){
  var t=e.target; if(!t.classList.contains("pick"))return;
  rows[+t.dataset.i].on=t.checked; render();
});
$("#btnPrint").onclick=function(){
  if(!rows.some(function(r){return r.on})){alert("لم تحدد أي بطاقة");return}
  window.print();
};
window.addEventListener("afterprint",function(){
  rows.forEach(function(r){if(r.on&&r.card)printed[r.card]=sig(r)});
  save(K.printed,printed); render();
});
$("#btnCheck").onclick=function(){
  var p=$("#panel");
  if(!p.classList.contains("hide")){p.classList.add("hide");return}
  var order={hi:0,mid:1,low:2}, lbl={hi:"حرج",mid:"تنبيه",low:"للعلم"};
  var sorted=issues.slice().sort(function(a,b){return order[a[0]]-order[b[0]]});
  var need=rows.filter(function(r){return needsPrint(r)});
  var html='<h2>فحص البيانات</h2>';
  html+= sorted.length
    ? '<ul>'+sorted.map(function(x){return '<li><span class="sev '+x[0]+'">'+lbl[x[0]]+'</span>'+esc(x[1])+'</li>'}).join("")+'</ul>'
    : '<p class="ok">لا توجد ملاحظات — البيانات متسقة.</p>';
  html+='<h3>بطاقات تحتاج طباعة ('+need.length+')</h3>';
  html+= need.length
    ? '<ul>'+need.map(function(r){return '<li>'+esc(r.nameAr||r.nameEn)+' — '+esc(r.card)+' — <b>'+needsPrint(r)+'</b></li>'}).join("")+'</ul>'
    : '<p class="ok">كل البطاقات المطبوعة مطابقة للقاعدة.</p>';
  p.innerHTML=html; p.classList.remove("hide");
};
 
/* ===== الإقلاع ===== */
printed=load(K.printed,{});
cfg=load(K.cfg,null);
if(!cfg||!cfg.url){
  var g=load(K.gate,null);
  if(g&&g.url){cfg={url:g.url,token:g.token||""};save(K.cfg,cfg);}
}
var cached=load(K.cache,null);
if(cached&&cached.badges) apply(cached.badges,true);
if(cfg&&cfg.url) sync();
else{ setStatus("لم يُضبط رابط الخدمة — اضغط «إعدادات» للاتصال بالقاعدة",true);
      if(!(cached&&cached.badges)) openCfg(); }
})();
</script>
